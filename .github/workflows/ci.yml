name: CI

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

      - name: Import smoke test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'dummy' }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID || 'dummy' }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET || 'dummy' }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || 'dummy' }}
        run: |
          python -c "import main, ai_engine, push_pushplus, push_wechat, styler; print('imports ok')"
